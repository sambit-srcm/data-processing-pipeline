version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - gosec
    - misspell
    - noctx
    - revive
    - unparam
  settings:
    gocyclo:
      min-complexity: 15
    errcheck:
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sambit-srcm/data-processing-pipeline

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
